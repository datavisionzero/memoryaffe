name: memoryaffe
services:
  db:
    image: postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    restart: unless-stopped
    environment:
      POSTGRES_DB: memoryaffe
      POSTGRES_USER: memoryaffe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U memoryaffe -d memoryaffe']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
  app:
    image: memoryaffe:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Memoryaffe__BaseUrl: ${MEMORYAFFE_BASE_URL:?MEMORYAFFE_BASE_URL fehlt, HTTPS-Origin erforderlich}
      Memoryaffe__SetupSecret: ${MEMORYAFFE_SETUP_SECRET:?MEMORYAFFE_SETUP_SECRET fehlt}
      ConnectionStrings__Database: ${MEMORYAFFE_DATABASE_CONNECTION:?MEMORYAFFE_DATABASE_CONNECTION fehlt}
    ports:
      - '127.0.0.1:${MEMORYAFFE_HTTP_PORT:-5080}:8080'
    volumes:
      - keys:/app/keys
      - imports:/app/imports
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [database, frontend]
volumes:
  postgres:
  keys:
  imports:
networks:
  database:
    internal: true
  frontend:
